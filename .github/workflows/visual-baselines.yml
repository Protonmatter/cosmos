name: Update visual baselines

# Regenerates the visual-regression baselines on the pinned runner and opens a
# pull request containing the new images, so a visual change is reviewed as a
# diff of pictures rather than merged as a wall of binary blobs.
#
# Run this when a visual change is intended, or once to seed the baselines for
# the first time.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the baselines are being refreshed
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Regenerate and propose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Writing a new baseline is reported as a failure by design — Playwright
      # will not silently bless an image it has never compared.
      - name: Regenerate baselines
        run: npm run test:visual:update
        continue-on-error: true

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain tests/visual)" ]; then
            echo "Baselines are unchanged; nothing to propose."
            exit 0
          fi

          BRANCH="visual-baselines/${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/visual
          git commit -m "Update visual baselines

          $REASON

          Regenerated by the Update visual baselines workflow on ubuntu-24.04."
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --title "Update visual baselines" \
            --body "Regenerated on \`ubuntu-24.04\`.

          **Reason given:** $REASON

          Review the image diffs below. Approving this pull request approves the new
          appearance as correct — see \`docs/specs/visual.spec.md\`." \
            --base "${GITHUB_REF_NAME}"
